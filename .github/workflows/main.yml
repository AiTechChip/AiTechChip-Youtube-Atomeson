name: Daily AI Tech Shorts Pipeline

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

concurrency:
  group: news-to-video-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-generativeai edge-tts "moviepy==1.0.3" pillow numpy requests \
            google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run the daily batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          AUTO_LOOP_INTERVAL_HOURS: "0"
        run: |
          python news_to_video_final.py

      - name: Persist pipeline state back to the repo
        run: |
          git config user.name "news-to-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          for f in processed_news.txt queued_news.txt pending_youtube_uploads.txt; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update pipeline state [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload rendered videos as a workflow artifact (optional backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-shorts-${{ github.run_id }}
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 7
          
